plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  instance-state-name: running
  tag:Name: roboshop-frontend

hostnames:
  - private-ip-address

# ansible-inventory -i inventory.aws_ec2.yaml --graph -> will get ungrouped list of ip's

# to group the ip's uisng name from tags
keyed_groups:
  - key: tags.Name
    separator: "" # this removes the beginning underscore for _roboshop_frontend and gives roboshop_frontend
